<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>條目框架</title>
<!--
  wiki-frame.html —— 條目「框架」檔。
  這個檔案只負責版面、樣式與渲染邏輯，不含任何條目內容。
  內容全部放在同目錄的 data.js（window.ARTICLE），圖片放在 assets/。
  換資料：只改 data.js 與 assets/，這個檔案不用動。

  頁面會自動做的事：
    • 由 ARTICLE.sections 產生標題與目次（含編號）
    • 把內文裡的 <sup class="ref" data-ref="鍵名"></sup> 依出現順序編號，
      並在 <div class="reflist" data-auto="references"></div> 填入註釋清單
    • 渲染右側資訊框、頁尾導航框、來源說明
  所有連結與「顯示／隱藏」字樣都只是外觀，沒有實際功能。
-->
<style>
/* ---------- 設計變數 ---------- */
:root {
  --bg-page: #f6f6f6;
  --bg: #ffffff;
  --text: #202122;
  --text-muted: #54595d;
  --link: #3366cc;
  --border: #a2a9b1;
  --border-light: #c8ccd1;
  --surface: #f8f9fa;
  --surface-2: #eaecf0;
  --infobox-head: #b0c4de;
  --navbox-title: #ccccff;
  --navbox-group: #ddddff;
  --font-body: -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", "Helvetica Neue", Arial, sans-serif;
  --font-heading: "Linux Libertine", Georgia, "Times New Roman", "Noto Serif TC", "PMingLiU", serif;
}

/* ---------- 頁面骨架 ---------- */
* { box-sizing: border-box; }
html { background: var(--bg-page); }
body {
  margin: 0; color: var(--text); background: var(--bg-page);
  font-family: var(--font-body); font-size: 14px; line-height: 1.6;
}
.page {
  max-width: 1280px; margin: 0 auto; background: var(--bg);
  border: 1px solid var(--border-light); border-top: 0;
  padding: 1.25em 1.5em 2em;
}
@media (max-width: 720px) { .page { padding: 1em 16px; border: 0; } }

/* 連結只是外觀（沒有 href） */
a { color: var(--link); text-decoration: none; }
a.ext::after {
  content: ""; display: inline-block; width: .7em; height: .7em; margin-left: .25em; vertical-align: baseline;
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12"><path fill="%2336c" d="M6 1h5v5L9.2 4.2 5.4 8 4 6.6l3.8-3.8L6 1zM2 3h3v1.5H3.5v4h4V7H9v3H2V3z"/></svg>') no-repeat center / contain;
}

h1, h2 { font-family: var(--font-heading); font-weight: normal; border-bottom: 1px solid var(--border); margin: 1em 0 .25em; padding: 0; line-height: 1.3; }
h1 { font-size: 1.9em; margin-top: 0; }
h2 { font-size: 1.5em; }
h3, h4, h5 { margin: 1em 0 .3em; line-height: 1.4; }
h3 { font-size: 1.2em; }
h4 { font-size: 1.05em; }
h5 { font-size: 1em; }
p { margin: .5em 0; }
ul, ol { margin: .3em 0 .3em 1.6em; padding: 0; }
li { margin-bottom: .1em; }
li > ul, li > ol { margin-top: 0; }
.no-bullet { list-style: none; }
.plainlist { list-style: none; margin: 0; padding: 0; }
.plainlist li { margin: 0; }
.nowrap { white-space: nowrap; }
b { font-weight: 600; }
.tagline { font-size: 92%; color: var(--text-muted); margin-bottom: 1em; }
.hatnote { font-style: italic; padding-left: 1.6em; margin: .3em 0 .5em; font-size: 95%; color: var(--text-muted); }
.deadlink { color: #d33; font-size: 85%; }
.langicon { font-size: 85%; color: var(--text-muted); }
.legend-swatch { display: inline-block; width: 1.1em; height: 1.1em; border: 1px solid #aaa; vertical-align: -0.15em; margin-right: .3em; }
.flag { white-space: nowrap; }
.flagicon { width: 23px; height: auto; vertical-align: middle; margin-right: .35em; border: 1px solid #e0e0e0; }
.columns { column-count: 2; column-gap: 2em; }
.columns ul { margin-top: 0; }

/* ---------- 資訊框 ---------- */
.infobox {
  float: right; clear: right; width: 23em; max-width: 100%;
  margin: 0 0 1em 1.2em; border: 1px solid var(--border); background: var(--surface);
  border-spacing: 3px; font-size: 88%; line-height: 1.5;
}
.infobox caption { font-size: 125%; font-weight: bold; padding: .3em .5em; background: var(--infobox-head); }
.infobox th, .infobox td { vertical-align: top; padding: .15em .4em; text-align: left; }
.infobox th.infobox-label { white-space: nowrap; padding-right: .6em; }
.infobox th.infobox-header { background: var(--infobox-head); text-align: center; padding: .3em; }
.infobox .infobox-image { text-align: center; }
.infobox .infobox-image img { max-width: 100%; height: auto; }
.infobox .infobox-caption { font-size: 95%; padding-top: .2em; }
.infobox .plainlist { line-height: 1.4; }

/* ---------- 圖片 ---------- */
figure.thumb {
  border: 1px solid var(--border-light); background: var(--surface); padding: 3px;
  font-size: 88%; width: 222px; max-width: 100%; margin: .5em 0 1.3em 1.4em;
}
figure.thumb img { width: 100%; height: auto; border: 1px solid var(--border-light); display: block; background: #fff; }
figure.thumb figcaption { padding: 3px 2px 0; line-height: 1.45; word-break: break-word; }
figure.thumb.tright { float: right; clear: right; }
figure.thumb.tleft { float: left; clear: left; margin: .5em 1.4em 1.3em 0; }
figure.thumb.tcenter { float: none; clear: both; margin: .5em auto 1.3em; }
figure.thumb.multi { width: auto; display: table; }
figure.thumb.multi .multi-row { display: flex; gap: 6px; align-items: flex-start; flex-wrap: wrap; }
figure.thumb.multi .multi-item { flex: 1 1 200px; max-width: 320px; }
figure.thumb.multi .multi-footer { border-top: 1px solid var(--border-light); margin-top: 4px; padding-top: 4px; text-align: center; }
.inline-img { max-width: 100%; height: auto; }

/* ---------- 表格 ---------- */
.table-scroll { overflow-x: auto; margin: 1em 0; }
table.wikitable { border-collapse: collapse; border: 1px solid var(--border); background: var(--surface); font-size: 92%; margin: 0; }
table.wikitable th, table.wikitable td { border: 1px solid var(--border); padding: .25em .5em; vertical-align: middle; }
table.wikitable th { background: var(--surface-2); text-align: center; }
table.wikitable.compare td, table.wikitable.compare th { text-align: center; }
table.wikitable.compare tr > td:first-child { text-align: left; font-weight: 600; background: var(--surface-2); }

/* ---------- 版面：左側目次欄 + 內文 ---------- */
.layout { display: flex; gap: 2em; align-items: flex-start; }
main#content { flex: 1 1 auto; min-width: 0; }

/* ---------- 目次（左側欄，隨頁面捲動時固定，太長時在欄內捲動） ---------- */
.toc {
  flex: 0 0 230px; position: sticky; top: 0; max-height: 100vh; overflow-y: auto;
  font-size: 90%; line-height: 1.5; padding: .4em 1em .4em 0; border-right: 1px solid var(--border-light);
}
.toc .toctitle h2 { font-size: 100%; font-family: inherit; font-weight: bold; border: 0; margin: 0 0 .4em; }
.toc ul { list-style: none; margin: 0; padding: 0; }
.toc ul ul { margin-left: 1.2em; }
.toc li { margin: .2em 0; }
.toc .tocnumber { color: var(--text-muted); padding-right: .4em; }
@media (max-width: 900px) {
  .layout { display: block; }
  .toc {
    position: static; max-height: 45vh; border: 1px solid var(--border); background: var(--surface);
    padding: .5em 1em .6em; margin: 1em 0;
  }
}

/* ---------- 註釋 ---------- */
sup.ref { font-size: .75em; line-height: 1; vertical-align: super; white-space: nowrap; }
sup.ref.missing a { color: #d33; }
.reflist { font-size: 90%; column-count: 2; column-gap: 2.5em; margin: .5em 0; }
.reflist ol.references { margin: 0 0 0 2.2em; padding: 0; }
.reflist ol.references li { margin-bottom: .3em; break-inside: avoid; padding-left: .2em; }
.reflist .backlinks { margin-right: .4em; color: var(--link); font-style: italic; font-weight: bold; }
.reflist .reference-text { word-break: break-word; }
.sister-box {
  float: right; clear: right; border: 1px solid var(--border); background: var(--surface);
  padding: .5em .8em; margin: 0 0 .5em 1em; font-size: 88%; max-width: 22em;
}

/* ---------- 頁尾導航框 ---------- */
.navboxes { clear: both; margin-top: 2em; }
.navbox { border: 1px solid var(--border); width: 100%; font-size: 88%; text-align: center; background: #fdfdfd; padding: 2px; margin-top: .4em; }
.navbox table { width: 100%; border-spacing: 0; border-collapse: separate; }
.navbox-title { background: var(--navbox-title); padding: .25em 5em; position: relative; font-weight: bold; }
.navbox-toggle { position: absolute; right: .6em; top: .25em; font-weight: normal; font-size: 90%; color: var(--link); }
.navbox-group { background: var(--navbox-group); white-space: nowrap; text-align: right; padding: .25em 1em; width: 1%; font-weight: bold; vertical-align: middle; }
.navbox-list { text-align: left; padding: .25em .6em; vertical-align: middle; }
.navbox tr + tr > .navbox-group, .navbox tr + tr > .navbox-list, .navbox tr + tr > .navbox-note { border-top: 2px solid #fdfdfd; }
.navbox-note { background: var(--navbox-group); padding: .25em 1em; }
.hlist ul { list-style: none; margin: 0; padding: 0; display: inline; }
.hlist li { display: inline; white-space: nowrap; }
.hlist li:not(:last-child)::after { content: " · "; font-weight: bold; white-space: normal; }

/* ---------- 頁尾 ---------- */
.page-footer { font-size: 85%; color: var(--text-muted); border-top: 1px solid var(--border-light); margin-top: 2em; padding-top: 1em; clear: both; }
#nodata { border: 2px dashed #d33; padding: 1em; margin: 2em 0; background: #fff4f4; }

/* ---------- 小螢幕 ---------- */
@media (max-width: 720px) {
  .infobox { float: none; width: auto; margin: 0 0 1em; }
  figure.thumb.tright, figure.thumb.tleft { float: none; margin: 1em auto; }
  .sister-box { float: none; max-width: none; margin: .5em 0; }
  .reflist, .columns { column-count: 1; }
  .navbox-title { padding: .25em 4em .25em .5em; }
  .navbox-group { white-space: normal; }
}
@media print {
  html, body, .page { background: #fff; }
  .page { border: 0; max-width: none; }
}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="firstHeading"></h1>
    <div class="tagline" id="tagline"></div>
  </header>

  <div class="layout">
    <nav id="toc" class="toc" aria-label="目次"></nav>
    <main id="content">
      <div id="infobox"></div>
      <div id="lead"></div>
      <div id="body"></div>
      <div id="navboxes" class="navboxes"></div>
    </main>
  </div>

  <footer class="page-footer" id="pagefooter"></footer>

  <div id="nodata" hidden>
    <b>找不到資料檔。</b>請確認同一個資料夾裡有 <code>data.js</code>，而且它定義了 <code>window.ARTICLE</code>。
  </div>
</div>

<!-- 資料檔：換資料只要替換這個檔案與 assets/ 資料夾 -->
<script src="data.js"></script>

<script>
(function () {
  'use strict';
  var A = window.ARTICLE;
  var $ = function (sel) { return document.querySelector(sel); };
  if (!A) { $('#nodata').hidden = false; return; }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function stripTags(h) { var d = document.createElement('div'); d.innerHTML = h; return d.textContent || ''; }

  /* ---------- 標題列 ---------- */
  document.title = stripTags(A.title || '條目');
  $('#firstHeading').innerHTML = A.title || '';
  $('#tagline').innerHTML = A.tagline || '';

  /* ---------- 資訊框 ---------- */
  if (A.infobox) {
    var ib = A.infobox, h = '<table class="infobox">';
    if (ib.title) h += '<caption>' + ib.title + '</caption>';
    if (ib.image && ib.image.src) {
      h += '<tr><td colspan="2" class="infobox-image"><img src="' + esc(ib.image.src) + '" alt="">' +
           (ib.image.caption ? '<div class="infobox-caption">' + ib.image.caption + '</div>' : '') + '</td></tr>';
    }
    (ib.groups || []).forEach(function (g) {
      if (!g.rows || !g.rows.length) return;
      if (g.header) h += '<tr><th colspan="2" class="infobox-header">' + g.header + '</th></tr>';
      g.rows.forEach(function (r) {
        h += '<tr><th scope="row" class="infobox-label">' + r.label + '</th><td class="infobox-data">' + r.value + '</td></tr>';
      });
    });
    $('#infobox').innerHTML = h + '</table>';
  }

  /* ---------- 導言與章節 ---------- */
  $('#lead').innerHTML = A.lead || '';
  var body = '';
  (A.sections || []).forEach(function (s, i) {
    var lv = Math.min(Math.max(s.level || 2, 2), 6);
    var id = s.id || ('section-' + (i + 1));
    body += '<h' + lv + ' id="' + esc(id) + '"><span class="mw-headline">' + s.title + '</span></h' + lv + '>' +
            '<div class="section-body">' + (s.html || '') + '</div>';
  });
  $('#body').innerHTML = body;

  /* 寬表格可以橫向捲動 */
  document.querySelectorAll('#body table.wikitable').forEach(function (t) {
    var w = document.createElement('div'); w.className = 'table-scroll';
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });

  /* ---------- 目次（自動編號） ---------- */
  (function buildToc() {
    var secs = A.sections || [];
    if (!secs.length) { $('#toc').remove(); return; }
    // 先整理成樹，再輸出巢狀清單
    var root = { children: [] }, stack = [root], counters = [];
    secs.forEach(function (s) {
      var lv = Math.min(Math.max(s.level || 2, 2), 6) - 2;
      if (lv > stack.length - 1) lv = stack.length - 1;      // 跳級時貼齊上一層
      stack = stack.slice(0, lv + 1);
      counters = counters.slice(0, lv + 1);
      counters[lv] = (counters[lv] || 0) + 1;
      var node = { num: counters.join('.'), text: stripTags(s.title), children: [] };
      stack[lv].children.push(node);
      stack.push(node);
    });
    function render(nodes) {
      if (!nodes.length) return '';
      return '<ul>' + nodes.map(function (n) {
        return '<li><a><span class="tocnumber">' + n.num + '</span><span class="toctext">' + esc(n.text) + '</span></a>' + render(n.children) + '</li>';
      }).join('') + '</ul>';
    }
    $('#toc').innerHTML = '<div class="toctitle"><h2>目次</h2></div>' + render(root.children);
  })();

  /* ---------- 註釋：依出現順序編號，產生清單 ---------- */
  (function buildRefs() {
    var refs = A.references || {}, order = [], byKey = {};
    document.querySelectorAll('#content sup.ref').forEach(function (sup) {
      var key = sup.getAttribute('data-ref') || '';
      if (!byKey[key]) { byKey[key] = { n: order.length + 1, count: 0 }; order.push(key); }
      byKey[key].count++;
      if (!refs[key]) sup.classList.add('missing');
      sup.innerHTML = '<a>[' + byKey[key].n + ']</a>';
    });
    var target = document.querySelector('#content .reflist[data-auto="references"]');
    if (!order.length) { if (target) target.innerHTML = '<p class="tagline">（本文尚無註釋）</p>'; return; }
    if (!target) {   // 資料裡忘了放註釋區：自動補在最後
      var hx = document.createElement('h2'); hx.innerHTML = '<span class="mw-headline">註釋</span>';
      target = document.createElement('div'); target.className = 'reflist';
      $('#body').appendChild(hx); $('#body').appendChild(target);
    }
    var ol = '<ol class="references">';
    order.forEach(function (key) {
      var e = byKey[key], back = '';
      if (e.count === 1) back = '^';
      else for (var i = 0; i < e.count; i++) back += String.fromCharCode(97 + (i % 26)) + ' ';
      var text = refs[key] || '<span class="deadlink">［找不到鍵名為「' + esc(key) + '」的文獻］</span>';
      ol += '<li><span class="backlinks">' + back.trim() + '</span><span class="reference-text">' + text + '</span></li>';
    });
    target.innerHTML = ol + '</ol>';
  })();

  /* ---------- 頁尾導航框（靜態展開） ---------- */
  (function buildNavboxes() {
    var out = '';
    (A.navboxes || []).forEach(function (b) {
      var t = '<div class="navbox"><table><tbody><tr><th class="navbox-title" colspan="2">' + esc(b.title || '') +
              '<span class="navbox-toggle">[隱藏]</span></th></tr>';
      (b.rows || []).forEach(function (r) {
        if (r.note != null) { t += '<tr><td class="navbox-note" colspan="2">' + esc(r.note) + '</td></tr>'; return; }
        var items = (r.items || []).map(function (it) { return '<li><a class="wl">' + esc(it) + '</a></li>'; }).join('');
        t += '<tr>' + (r.group ? '<th class="navbox-group">' + esc(r.group) + '</th><td class="navbox-list hlist"><ul>' + items + '</ul></td>'
                                : '<td class="navbox-list hlist" colspan="2"><ul>' + items + '</ul></td>') + '</tr>';
      });
      out += t + '</tbody></table></div>';
    });
    $('#navboxes').innerHTML = out;
  })();

  /* ---------- 來源說明 ---------- */
  if (A.source) {
    var s = A.source;
    $('#pagefooter').innerHTML = '本頁文字內容取自 <a class="ext">' + esc(s.name) + '</a>' +
      (s.url ? '（' + esc(s.url) + '）' : '') + (s.retrieved ? '，擷取於 ' + esc(s.retrieved) : '') +
      '，依 ' + esc(s.license || '') + ' 授權釋出。圖片各有其授權，來源清單見 assets/SOURCES.txt。';
  }
})();
</script>
</body>
</html>
